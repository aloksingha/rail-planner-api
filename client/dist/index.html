      /* Hard-Locked Theme for Zero-Flicker Boot */
      html, body {
        background-color: #0b1120 !important;
        margin: 0;
        padding: 0;
        height: 100dvh;
        overflow: hidden;
        /* Adds padding to prevent content from going under the status bar/notches */
        padding-top: env(safe-area-inset-top);

        padding-left: env(safe-area-inset-left);

      }
      #root {
        opacity: 0;
        transition: opacity 0.5s ease-in-out;
      }
      #root.ready {

      #boot-splash {
        position: fixed;

        border-top-color: #0ea5e9;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
    <script>
      // Force "Ready" signal once React mounts (v2.9.9 - Auto-Reveal)
      window.markAppReady = function() {
        console.log('App signaling READY. Revealing UI...');
        const root = document.getElementById('root');
        const splash = document.getElementById('boot-splash');
        if (root) root.classList.add('ready');
        if (splash) {
          splash.style.transition = 'opacity 0.4s ease';
          splash.style.opacity = '0';
          setTimeout(function() { splash.style.display = 'none'; }, 400);
        }
      };

      // Safety timeout in case React fails to signal (3s)
      setTimeout(function() {
        if (document.getElementById('boot-splash')?.style.display !== 'none') {
          console.warn('Safety timeout reached. Forcing reveal.');
          window.markAppReady();
        }
      }, 3000);

      // Safe error handling without auto-reload loop
      window.addEventListener('unhandledrejection', function(e) {
        if (e.reason && (e.reason.name === 'ChunkLoadError' || /Loading chunk/.test(e.reason.message))) {
          console.warn('Chunk load error detected. Manual refresh may be required.');
        }
      });
    </script>
