    <script>
      // Force "Ready" signal once React mounts (v3.1.0 - Zero Blank Screen)
      window.markAppReady = function() {
        console.log('App signaling READY. Revealing UI...');
        const root = document.getElementById('root');
        const splash = document.getElementById('boot-splash');
        if (root) root.classList.add('ready');
        if (splash) {
          splash.style.transition = 'opacity 0.25s ease';
          splash.style.opacity = '0';
          setTimeout(function() { splash.style.display = 'none'; }, 250);
        }
      };

      // Active Auto-Recovery for Dynamic Chunk / Cache Mismatch Failures
      function triggerAutoRecovery(reason) {
        console.warn('[AutoRecovery] Triggered due to:', reason);
        var key = 'tp_autoreload_ts';
        var last = parseInt(sessionStorage.getItem(key) || '0', 10);
        var now = Date.now();
        if (now - last > 8000) {
          sessionStorage.setItem(key, now.toString());
          if ('caches' in window) {
            caches.keys().then(function(names) {
              return Promise.all(names.filter(function(n) { return n !== 'tickets-pro-hot-cache'; }).map(function(n) { return caches.delete(n); }));
            }).finally(function() {
              if ('serviceWorker' in navigator) {
                navigator.serviceWorker.getRegistrations().then(function(regs) {
                  regs.forEach(function(r) { r.unregister(); });
                  window.location.reload();
                }).catch(function() {
                  window.location.reload();
                });
              } else {
                window.location.reload();
              }
            });
          } else {
            window.location.reload();
          }
        }
      }

      window.addEventListener('unhandledrejection', function(e) {
        var msg = e && e.reason ? (e.reason.message || String(e.reason)) : '';
        var name = e && e.reason ? e.reason.name : '';
        if (name === 'ChunkLoadError' || /Loading chunk/i.test(msg) || /Failed to fetch dynamically imported module/i.test(msg)) {
          triggerAutoRecovery(msg);
        }
      });

      window.addEventListener('error', function(e) {
        var msg = e && e.message ? e.message : '';
        if (/Loading chunk/i.test(msg) || /Failed to fetch dynamically imported module/i.test(msg)) {
          triggerAutoRecovery(msg);
        }
      });

      // Watchdog: Guarantee zero permanent blank screens
      setTimeout(function() {
        var root = document.getElementById('root');
        var splash = document.getElementById('boot-splash');
        if (splash && splash.style.display !== 'none') {
